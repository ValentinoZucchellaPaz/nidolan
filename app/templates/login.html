{% extends "base.html" %}
{% block body %}
<main class="login-page">
  <section class="login-panel">
    <div class="brand"><span class="brand-mark" aria-hidden="true">⌂</span><span>Mi Drive</span></div>
    <h1>Tus archivos,<br>en casa.</h1>
    <p>Entrá desde cualquier dispositivo de tu red local.</p>
    {% if error %}<p class="notice error" role="alert">Usuario o contraseña incorrectos.</p>{% endif %}
    <form action="/login" method="post" class="login-form">
      <label>Usuario<input name="username" autocomplete="username" required autofocus></label>
      <label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="button primary" type="submit">Ingresar</button>
    </form>
  </section>
</main>
{% endblock %}
