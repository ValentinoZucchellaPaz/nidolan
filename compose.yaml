services:
  selfdrive:
    build: .
    container_name: selfdrive
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-8080}:8080"
    volumes:
      - ${DATA_DIR}:/data
      - ${STATE_DIR}:/var/lib/selfdrive
